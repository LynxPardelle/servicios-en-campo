name: Verificación y entrega
'on':
  push:
    branches:
    - development
    - testing
    - main
  pull_request:
    branches:
    - development
    - testing
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: zoo/ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: web/package-lock.json
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - run: python -m pip install cfn-lint==1.60.1
    - run: npm run check:config
    - run: npm test
    - run: cfn-lint -t infra/template.yaml
    - run: npm --prefix web ci
    - run: npm run test:web
    - run: npm run build:web
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: web-${{ github.sha }}
        path: web/dist/
        if-no-files-found: error
        retention-days: 7
  deploy-backend:
    name: Backend del ambiente
    needs: verify
    if: github.event_name != 'pull_request' && vars.ENABLE_AWS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'testing' && 'testing' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '24'
    - name: Validar rama y parámetros del ambiente
      env:
        AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        AWS_REGION: ${{ vars.AWS_REGION }}
      run: |
        node tools/check-config.mjs "$GITHUB_REF_NAME"
        test -n "$AWS_DEPLOY_ROLE_ARN" && test -n "$AWS_REGION"
        stage=$(node --input-type=module -e "import {stageForBranch} from './tools/check-config.mjs'; console.log(stageForBranch(process.env.GITHUB_REF_NAME))")
        echo "DEPLOY_STAGE=$stage" >> "$GITHUB_ENV"
    - uses: aws-actions/setup-sam@f84ec7d548307efafe33230528756de3c5841a17
      with:
        use-installer: true
    - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
      with:
        role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}
    - name: Empaquetar y desplegar backend
      working-directory: infra
      run: |
        sam build --config-env "$DEPLOY_STAGE"
        sam deploy --config-env "$DEPLOY_STAGE" --config-file ../../samconfig.toml --template-file .aws-sam/build/template.yaml --no-confirm-changeset --no-fail-on-empty-changeset
    - name: Comprobar salud del backend
      run: |
        stack=$(node --input-type=module -e "import fs from 'node:fs'; console.log(JSON.parse(fs.readFileSync('infra/environments.json'))[process.env.DEPLOY_STAGE].stackName)")
        api=$(aws cloudformation describe-stacks --stack-name "$stack" --query "Stacks[0].Outputs[?OutputKey=='HealthUrl'].OutputValue | [0]" --output text)
        curl --fail --silent --show-error "$api" | node --input-type=module -e "let text='';for await(const chunk of process.stdin)text+=chunk;const result=JSON.parse(text);if(result.status!=='ok'||result.stage!==process.env.DEPLOY_STAGE)process.exit(1);console.log('Backend verified')"
